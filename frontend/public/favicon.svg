<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="imGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="32" height="32" rx="8" fill="url(#imGrad)"/>

  <!-- Interconnected graph edges forming I & M -->
  <!-- Left stem for 'I' -->
  <path d="M 8 7 L 8 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Right 'M' diagonals and stems -->
  <path d="M 15 25 L 15 10 L 21 18 L 27 10 L 27 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Graph Nodes at key junctions -->
  <circle cx="8" cy="7" r="2.5" fill="#ffffff"/>
  <circle cx="8" cy="25" r="2.5" fill="#ffffff"/>
  <circle cx="15" cy="10" r="2.5" fill="#a5b4fc"/>
  <circle cx="21" cy="18" r="2.5" fill="#ffffff"/>
  <circle cx="27" cy="10" r="2.5" fill="#a5b4fc"/>
  <circle cx="27" cy="25" r="2.5" fill="#ffffff"/>
</svg>